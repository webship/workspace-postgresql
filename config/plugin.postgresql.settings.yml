# PostgreSQL — core/config/plugin.postgresql.settings.yml
#
# The DATABASE menu of a project whose database is PostgreSQL, and its tool, cmd-tools-postgresql.sh.

# The web admin the menu offers: adminer or none. On DDEV it is the official add-on ddev/ddev-adminer, added to a
# project the first time it is asked for (and the project restarted). pgAdmin has no official DDEV add-on yet, and the
# other runtimes cannot add a web admin to a project yet.
admin: adminer

# How many exports of one project the backups folder keeps: when a new one is made, the oldest go (the exports made
# before an import among them), never the dump an import is reading. 0 keeps every one.
keep: 0
